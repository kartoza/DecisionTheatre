<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Theatre</title>
    <meta name="description" content="Explore African catchment data across past, present, and future scenarios" />
    <!--
      Typefaces are self-hosted; see frontend/src/assets/fonts/fonts.css.
      Nothing here may fetch from a third party: this document is embedded in
      the offline desktop application, where an external request either fails or
      blocks first paint.
    -->
    <!--
      Analytics, loaded only in a real browser.

      This used to be an unconditional script tag three lines below a comment
      saying nothing here may fetch from a third party — and it was the one thing
      breaking that rule. In the desktop build the request either fails or blocks
      first paint, which is exactly what the rule exists to prevent, and it
      reported the desktop application's usage to Google as though it were a web
      visit.

      The webview sets __DECISION_THEATRE_WEBVIEW__ before any page script runs,
      so this check is reliable rather than a guess about the environment.

      This is not yet consent: the project's standard is opt-in telemetry with a
      visible toggle and a documented data schema, and the measurement ID is still
      baked into the build rather than supplied at runtime. Both are tracked.
    -->
    <script>
      if (!window.__DECISION_THEATRE_WEBVIEW__) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-VZ4F168MHJ');

        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-VZ4F168MHJ';
        document.head.appendChild(ga);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The global error handlers live in src/main.tsx and are compiled out of a
      production build. They used to be here, injecting a fixed red block
      containing the full stack trace into the live page: internal file paths and
      frame details shown to whoever happened to be using the application. The
      React error boundary is the production recovery path.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
