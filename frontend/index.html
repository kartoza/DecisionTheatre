<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Theatre</title>
    <meta name="description" content="Explore African catchment data across past, present, and future scenarios" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:1em;z-index:99999;font-size:14px;white-space:pre-wrap;';
        d.textContent = 'JS Error: ' + msg + '\n' + url + ':' + line + ':' + col + '\n' + (error && error.stack ? error.stack : '');
        document.body.appendChild(d);
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:darkred;color:white;padding:1em;z-index:99999;font-size:14px;white-space:pre-wrap;';
        d.textContent = 'Unhandled Promise: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
