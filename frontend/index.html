<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Theatre</title>
    <meta name="description" content="Explore African catchment data across past, present, and future scenarios" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />
  <!-- Google tag (gtag.js) --> 
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZ4F168MHJ"></script>
    <script>   
    window.dataLayer = window.dataLayer || [];   
    function gtag(){dataLayer.push(arguments);}   
    gtag('js', new Date());   gtag('config', 'G-VZ4F168MHJ'); 
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:1em;z-index:99999;font-size:14px;white-space:pre-wrap;';
        d.textContent = 'JS Error: ' + msg + '\n' + url + ':' + line + ':' + col + '\n' + (error && error.stack ? error.stack : '');
        document.body.appendChild(d);
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:darkred;color:white;padding:1em;z-index:99999;font-size:14px;white-space:pre-wrap;';
        d.textContent = 'Unhandled Promise: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
