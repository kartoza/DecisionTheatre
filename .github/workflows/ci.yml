name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # Flake / manifest lock step
  #
  # Runs first and gates everything else. A fixed-output hash that has fallen
  # behind its manifest is invisible to whoever caused it — their store already
  # holds the vendored output, so nothing revalidates the hash — and it breaks
  # the build for every consumer importing this flake. Catch it in seconds
  # rather than at the end of a full build, and say precisely what to run.
  # ==========================================
  flake-lock-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # scripts/sync-flake.sh, through the flake app — the same script the
      # pre-commit hook runs, so a commit that passed the hook and a build that
      # failed here cannot mean two different things.
      #
      # The guidance on failure used to be restated inline in this file, which
      # made it a second copy of something the script already knew and was free
      # to fall out of date with it. The script emits its own annotations now
      # (see ui_annotate in scripts/lib-ui.sh), naming the hash, the manifest
      # that moved, and the command that fixes it.
      - name: Fast check — flake.nix matches the recorded manifests
        run: nix run .#check-flake -- --check

      - name: Deep verify — recompute the real hashes
        run: nix run .#check-flake -- --verify

  # ==========================================
  # Secrets & security scanning
  # ==========================================
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # The gitleaks *action* requires a paid licence key for organisation
      # repositories and fails without one, so this has to be the CLI. It does
      # not have to be a download: gitleaks is in devShells.tooling, and
      # scripts/secrets-check.sh takes it from there.
      #
      # This step used to curl a pinned tarball into /tmp and untar it. Three
      # things were wrong with that. A scanner whose job is supply-chain
      # assurance was itself fetched over the network from outside the flake.
      # The pin drifted — CI said 8.21.2, the flake says 8.30.0, and the
      # pre-commit hook pinned its own third copy. And the CLI it called no
      # longer exists: `detect` and `protect` were replaced by `git` and `dir`
      # in the version the flake provides, so the two would have diverged into
      # a hard failure the first time anyone reconciled them.
      #
      # Same script as the pre-commit hook, without --staged: the hook guards
      # what is about to be committed, this reads all of history.
      - name: Gitleaks secrets scan
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            develop .#tooling --command ./scripts/secrets-check.sh

  # ==========================================
  # Check for large or unwanted files
  # ==========================================
  file-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for large files (>5MB)
        run: |
          large_files=$(find . -type f -size +5M \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.go/*' 2>/dev/null || true)
          if [ -n "$large_files" ]; then
            echo "::error::Large files found that should be gitignored:"
            echo "$large_files"
            exit 1
          fi

      - name: Check for common unwanted files
        run: |
          unwanted=""
          for pattern in "*.env" "*.pem" "*.key" "credentials*.json" "*.p12" "*.pfx"; do
            found=$(find . -name "$pattern" -not -path './.git/*' 2>/dev/null || true)
            if [ -n "$found" ]; then
              unwanted="$unwanted\n$found"
            fi
          done
          if [ -n "$unwanted" ]; then
            echo "::error::Potentially sensitive files found:"
            echo -e "$unwanted"
            exit 1
          fi


      # version.sh reported `git describe` alone, which names the newest *tag*.
      # With flake.nix declaring 0.4.0 and the newest tag v0.2.2, every local
      # build called itself 0.2.2-... while `nix build` called the same source
      # 0.4.0. A second of shell, and invisible until two binaries are compared.
      - name: Shell script tests
        run: |
          ./scripts/tests/version-test.sh
          ./scripts/tests/report-tables-test.sh

  # ==========================================
  # Shell and nix
  #
  # Neither of these ran in CI at all until now, though both were required of
  # every contributor by the pre-commit hooks — so a check a contributor could
  # not skip was one review never performed, and anyone committing with the
  # hooks uninstalled bypassed it entirely.
  #
  # A great deal of this project is shell that nothing compiles or type-checks:
  # the build, the packaging, the data pipeline, the release and the checks
  # themselves. flake.nix is the definition of what everyone builds with.
  #
  # Both take seconds, and both run the same scripts as the hooks — including
  # the same derived file list, which is what brings devbin/dt,
  # packaging/appimage/AppRun and the scripts in resources/ inside the gate for
  # the first time; the old hook regex only matched scripts/.
  # ==========================================
  tooling-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # One `nix develop` for both, rather than one each: entering the tooling
      # shell is the only slow part, and it is about half a second warm.
      - name: shellcheck and nixpkgs-fmt
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            develop .#tooling --command bash -c '
              set -e
              ./scripts/shell-check.sh
              ./scripts/nix-check.sh
            '

  # ==========================================
  # Go lint
  # ==========================================
  lint-go:
    runs-on: ubuntu-latest
    # Azure-hosted runners resolve apt mirrors through
    # mirror+file:/etc/apt/apt-mirrors.txt, and azure.archive.ubuntu.com has been
    # seen to stall with no response. Plain apt-get has no timeout for that, so it
    # hangs until GitHub's own multi-hour job ceiling. This bounds the damage to one
    # retry cycle instead.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # First, because it is the cheapest question this job asks and the one
      # with the most annoying failure mode. It needs no system packages, no
      # cgo and no linter binary — about a second against five minutes for the
      # step below — so a formatting mistake is reported almost immediately
      # instead of at the end of the slowest job.
      #
      # Same script as `dt fmt-check`, so what CI means by "formatted" and what
      # a developer machine means by it cannot drift apart. `gofmt -s`, matching
      # `dt fmt`.
      - name: gofmt
        run: ./scripts/gofmt-check.sh --github

      - name: Create stub dirs for embed
        run: |
          mkdir -p internal/server/static && touch internal/server/static/.gitkeep
          mkdir -p internal/server/docs_site && touch internal/server/docs_site/.gitkeep

      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get install -y libopenblas-dev libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      # webview_go asks pkg-config for webkit2gtk-4.0, which no current
      # distribution ships. Without the shim every cgo-touching command fails
      # with "could not import github.com/webview/webview_go" — which is what
      # broke this job and test-go. The same script runs locally, so CI and a
      # developer machine resolve the dependency identically.
      - name: webkit2gtk-4.0 compatibility shim
        run: ./scripts/webkit-compat.sh --github-env

      - name: golangci-lint
        # golangci-lint v2 needs action v7 or later; v6 with a v2 binary exits
        # with code 3 before linting anything. The version is pinned to the one
        # in the development shell so `dt lint` and CI agree.
        #
        # The rules come from .golangci.yml, which is committed and commented:
        # what is enabled, why each linter is there, and what is deliberately
        # not enabled yet. Nothing here should add arguments that change the
        # rule set, or the committed file stops being the answer.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          args: --timeout 5m

  # ==========================================
  # Frontend lint & typecheck
  # ==========================================
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript typecheck
        run: cd frontend && npx tsc --noEmit

      # The job has been called lint-frontend since it was written while running
      # no linter at all: there was no eslint configuration, so the script exited
      # with an error rather than a result and nothing invoked it. It lints now.
      - name: ESLint
        run: cd frontend && npm run lint

  # ==========================================
  # Go tests
  # ==========================================
  test-go:
    runs-on: ubuntu-latest
    # See the identical timeout on lint-go: an unresponsive azure.archive.ubuntu.com
    # mirror can hang plain apt-get indefinitely.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create stub dirs for embed
        run: |
          mkdir -p internal/server/static && touch internal/server/static/.gitkeep
          mkdir -p internal/server/docs_site && touch internal/server/docs_site/.gitkeep

      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get install -y libopenblas-dev libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: webkit2gtk-4.0 compatibility shim
        run: ./scripts/webkit-compat.sh --github-env

      # ./... includes internal/datacheck's TestSpecCovers* — the data-contract
      # drift guard that the pre-commit hook runs on its own as
      # scripts/drift-check.sh. There is deliberately no separate step for it:
      # it would need this job's apt install and webkit shim all over again, so
      # it would cost minutes to save seconds.
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
        env:
          CGO_ENABLED: 1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ==========================================
  # Frontend tests
  # ==========================================
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test

  # ==========================================
  # Nix build verification
  # ==========================================
  nix-build:
    runs-on: ubuntu-latest
    needs: [flake-lock-step, test-go, test-frontend, lint-go, lint-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build application
        run: nix build

      - name: Verify binary
        run: ./result/bin/decision-theatre --version

  # ==========================================
  # Security audit (Trivy)
  # ==========================================
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # An advisory with no released fix is not something a pull request
          # can act on; failing every build for it trains people to ignore the
          # job. Anything deliberately accepted goes in .trivyignore with a
          # reason and an expiry date.
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  # ==========================================
  # Importability
  #
  # The lock-step job proves the hashes are right; this proves the conclusion
  # that matters — that a third party can import this flake and build it. It
  # runs with the store cold for our derivations, so a stale fixed-output hash
  # fails here exactly as it would for them.
  # ==========================================
  import-flake:
    runs-on: ubuntu-latest
    needs: [flake-lock-step]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build this flake as an external consumer would
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/flake.nix <<EOF
          {
            inputs.dt.url = "path:${GITHUB_WORKSPACE}";
            outputs = { self, dt }: {
              packages.x86_64-linux.default = dt.packages.x86_64-linux.decision-theatre;
            };
          }
          EOF
          cd /tmp/consumer
          nix --extra-experimental-features 'nix-command flakes' \
            build .#default --no-link 2>&1 | tail -20
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
  # ==========================================
  # Container image
  #
  # One image, built from the flake. Its contents are the runtime closure of the
  # binary nix already builds, so there is no second dependency list to fall out
  # of step with the first — which is exactly how the hand-maintained Dockerfile
  # came to install WebKit 4.0 while everything else targeted 4.1, and to omit a
  # mkdocs plugin without which no image could be built at all.
  #
  # On a pull request the image is published as a 7-day artefact with its SBOM
  # and CVE scan, and the pull request is annotated with both tables. On a
  # release it is pushed to GHCR and the same files are attached as long-lived
  # assets — see .github/workflows/release.yml.
  #
  # The scan does not fail the build. A CVE in a system library is a fact to
  # weigh, not automatically a defect here, and a gate that trips on every
  # Negligible finding in glibc trains people to ignore it. Gating belongs to an
  # agreed severity policy.
  # ==========================================
  container-nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the image from the flake
        id: build
        run: |
          nix build .#container --print-build-logs
          tag="$(nix eval --raw .#container.imageTag)"
          name="$(nix eval --raw .#container.imageName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=$name:$tag" >> "$GITHUB_OUTPUT"
          # The flake tags every build with the version in flake.nix, so each
          # one is `decision-theatre:4.0.0` no matter which commit it came from.
          # Two pull requests then produce images a reviewer cannot tell apart,
          # and loading one silently replaces the other. Stamp the commit into a
          # second tag so each build is its own identifiable thing. The
          # version-tagged name is kept for the --version check below, which is
          # about the version and nothing else.
          echo "sha_image=$name:$tag-${SHA:0:12}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Load it into docker
        run: |
          docker load < result
          docker tag ${{ steps.build.outputs.image }} ${{ steps.build.outputs.sha_image }}
          docker image ls ${{ steps.build.outputs.name }}

      - name: It reports the flake's version
        run: |
          got="$(docker run --rm ${{ steps.build.outputs.image }} --version)"
          echo "$got"
          case "$got" in
            *"${{ steps.build.outputs.tag }}"*) ;;
            *) echo "::error::--version ($got) does not match the image tag"; exit 1 ;;
          esac

      - name: It serves
        run: |
          docker run -d --name dt-ci -p 8080:8080 ${{ steps.build.outputs.image }}
          # Up to two minutes: the server opens four listeners and the first
          # request touches the data directory.
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/api/health; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "::error::The container never became healthy"
            docker logs dt-ci
            exit 1
          fi
          curl -fsS -o /dev/null http://127.0.0.1:8080/          # the application
          curl -fsS -o /dev/null http://127.0.0.1:8080/docs/     # the mkdocs site
          docker rm -f dt-ci

      - name: It carries a trust store, so outbound TLS works
        run: |
          img="${{ steps.build.outputs.image }}"
          # Read from outside rather than running anything: the image is the
          # application's closure plus cacert and tzdata, and has no shell. An
          # earlier version ran `sh -c 'test -r "$SSL_CERT_FILE"'` and reported
          # "SSL_CERT_FILE is not readable" when what actually happened was that
          # `sh` does not exist. A check whose failure message asserts something
          # it never tested is worse than no check.
          cert="$(docker image inspect "$img" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | sed -n 's/^SSL_CERT_FILE=//p')"
          if [ -z "$cert" ]; then
            echo "::error::the image declares no SSL_CERT_FILE"
            exit 1
          fi
          cid="$(docker create "$img")"
          if docker export "$cid" | tar -tf - "${cert#/}" > /dev/null 2>&1; then
            echo "trust store present: $cert"
          else
            echo "::error::$cert is declared but is not in the image"
            docker rm -f "$cid" > /dev/null
            exit 1
          fi
          docker rm -f "$cid" > /dev/null

      - name: Export the image
        run: |
          # Saved under the commit-stamped tag: that is the name it will carry
          # once a reviewer loads it, and it is the one that identifies which
          # build they are looking at.
          docker save ${{ steps.build.outputs.sha_image }} \
            | gzip > decision-theatre-image.tar.gz
          ls -lh decision-theatre-image.tar.gz

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      # syft and grype come from the flake, pinned by flake.lock, like every other
      # tool this project builds with. They were previously fetched by piping
      # anchore's install scripts into a shell, which is the one thing a
      # supply-chain step must not do: unpinned, unverified tools reporting on
      # what we ship. This job already installs nix a few steps above.
      - name: Scan for known vulnerabilities
        run: |
          nix develop .#supplychain --command bash -euo pipefail -c '
            syft ${{ steps.build.outputs.image }} -o json > sbom-syft.json
            # An empty match set rather than a failed step when grype cannot
            # produce a result: the report says "none reported", which is honest,
            # and the SBOM is attached either way.
            grype sbom:sbom.spdx.json -o json > cve-scan.json 2>/dev/null \
              || echo "{\"matches\":[]}" > cve-scan.json
          '

      - name: Assemble the report
        run: |
          {
            printf '## Container image\n\n'
            printf '`%s` — %s\n\n' "${{ steps.build.outputs.sha_image }}" \
              "$(du -h decision-theatre-image.tar.gz | cut -f1) compressed"
            printf 'Built from the flake: its contents are the runtime closure of the binary, so nothing states a dependency version twice.\n\n'
            printf '### Software bill of materials\n\n'
            nix develop .#supplychain --command python3 scripts/sbom_table.py sbom-syft.json
            printf '\n### Vulnerability scan\n\n'
            nix develop .#supplychain --command python3 scripts/cve_table.py cve-scan.json
          } > build-report.md
          cat build-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image, SBOM and scan
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: |
            decision-theatre-image.tar.gz
            sbom.spdx.json
            cve-scan.json
          retention-days: 7
          overwrite: true

      - name: Find the previous comment
        if: github.event_name == 'pull_request'
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## Container image"

      - name: Assemble the pull request comment
        if: github.event_name == 'pull_request'
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE: ${{ steps.build.outputs.sha_image }}
        run: |
          {
            cat build-report.md
            printf '\n---\n\n### Try this build\n\n'
            printf 'This image lives in the run artefacts, not in a registry — there is nothing to `docker pull` — because pull requests do not publish to GHCR; only tagged releases do. Fetch it with the `gh` CLI:\n\n'
            printf '```bash\n'
            printf 'gh run download %s --repo %s --name container-image\n' "$RUN_ID" "$REPO"
            printf 'docker load < decision-theatre-image.tar.gz\n'
            printf 'docker run --rm -p 8080:8080 %s\n' "$IMAGE"
            printf '```\n\n'
            printf 'Or download `container-image` from [this run](https://github.com/%s/actions/runs/%s) in the browser and unzip it first.\n\n' \
              "$REPO" "$RUN_ID"
            printf 'It loads as `%s` — the flake version stamped with the commit, so builds from different pull requests do not overwrite each other on your machine. Kept for 7 days; commit `%s`.\n\n' \
              "$IMAGE" "$SHA"
            printf 'Released images *are* in the registry: `ghcr.io/kartoza/decisiontheatre:<version>` for every release, plus `:latest` following the newest stable one.\n'
          } > pr-comment.md

      - name: Post or update the comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: pr-comment.md
