name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # Flake / manifest lock step
  #
  # Runs first and gates everything else. A fixed-output hash that has fallen
  # behind its manifest is invisible to whoever caused it — their store already
  # holds the vendored output, so nothing revalidates the hash — and it breaks
  # the build for every consumer importing this flake. Catch it in seconds
  # rather than at the end of a full build, and say precisely what to run.
  # ==========================================
  flake-lock-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fast check — flake.nix matches the recorded manifests
        run: |
          nix run .#check-flake -- --check || {
            echo "::error::flake.nix is out of step with go.mod, go.sum or frontend/package-lock.json."
            echo "::error::Run 'make sync-flake' and commit flake.nix with nix/manifest-lock.json."
            exit 1
          }

      - name: Deep verify — recompute the real hashes
        run: |
          nix run .#check-flake -- --verify || {
            echo "::error::A hash recorded in flake.nix is wrong. Anyone importing this flake will fail to build."
            echo "::error::Run 'make sync-flake' and commit the result."
            exit 1
          }

  # ==========================================
  # Secrets & security scanning
  # ==========================================
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # The gitleaks *action* requires a paid licence key for organisation
      # repositories and fails without one. The CLI has no such restriction and
      # is the same scanner, so run that instead — and it matches what
      # .pre-commit-config.yaml runs locally.
      - name: Gitleaks secrets scan
        run: |
          version=8.21.2
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --no-banner

  # ==========================================
  # Check for large or unwanted files
  # ==========================================
  file-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for large files (>5MB)
        run: |
          large_files=$(find . -type f -size +5M \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.go/*' 2>/dev/null || true)
          if [ -n "$large_files" ]; then
            echo "::error::Large files found that should be gitignored:"
            echo "$large_files"
            exit 1
          fi

      - name: Check for common unwanted files
        run: |
          unwanted=""
          for pattern in "*.env" "*.pem" "*.key" "credentials*.json" "*.p12" "*.pfx"; do
            found=$(find . -name "$pattern" -not -path './.git/*' 2>/dev/null || true)
            if [ -n "$found" ]; then
              unwanted="$unwanted\n$found"
            fi
          done
          if [ -n "$unwanted" ]; then
            echo "::error::Potentially sensitive files found:"
            echo -e "$unwanted"
            exit 1
          fi

  # ==========================================
  # Go lint
  # ==========================================
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create stub dirs for embed
        run: |
          mkdir -p internal/server/static && touch internal/server/static/.gitkeep
          mkdir -p internal/server/docs_site && touch internal/server/docs_site/.gitkeep

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      # webview_go asks pkg-config for webkit2gtk-4.0, which no current
      # distribution ships. Without the shim every cgo-touching command fails
      # with "could not import github.com/webview/webview_go" — which is what
      # broke this job and test-go. The same script runs locally, so CI and a
      # developer machine resolve the dependency identically.
      - name: webkit2gtk-4.0 compatibility shim
        run: ./scripts/webkit-compat.sh --github-env

      - name: golangci-lint
        # golangci-lint v2 needs action v7 or later; v6 with a v2 binary exits
        # with code 3 before linting anything. The version is pinned to the one
        # in the development shell so `dt lint` and CI agree.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          args: --timeout 5m

  # ==========================================
  # Frontend lint & typecheck
  # ==========================================
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript typecheck
        run: cd frontend && npx tsc --noEmit

  # ==========================================
  # Go tests
  # ==========================================
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create stub dirs for embed
        run: |
          mkdir -p internal/server/static && touch internal/server/static/.gitkeep
          mkdir -p internal/server/docs_site && touch internal/server/docs_site/.gitkeep

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: webkit2gtk-4.0 compatibility shim
        run: ./scripts/webkit-compat.sh --github-env

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
        env:
          CGO_ENABLED: 1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ==========================================
  # Frontend tests
  # ==========================================
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test

  # ==========================================
  # Nix build verification
  # ==========================================
  nix-build:
    runs-on: ubuntu-latest
    needs: [flake-lock-step, test-go, test-frontend, lint-go, lint-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build application
        run: nix build

      - name: Verify binary
        run: ./result/bin/decision-theatre --version

  # ==========================================
  # Security audit (Trivy)
  # ==========================================
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # An advisory with no released fix is not something a pull request
          # can act on; failing every build for it trains people to ignore the
          # job. Anything deliberately accepted goes in .trivyignore with a
          # reason and an expiry date.
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  # ==========================================
  # Importability
  #
  # The lock-step job proves the hashes are right; this proves the conclusion
  # that matters — that a third party can import this flake and build it. It
  # runs with the store cold for our derivations, so a stale fixed-output hash
  # fails here exactly as it would for them.
  # ==========================================
  import-flake:
    runs-on: ubuntu-latest
    needs: [flake-lock-step]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build this flake as an external consumer would
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/flake.nix <<EOF
          {
            inputs.dt.url = "path:${GITHUB_WORKSPACE}";
            outputs = { self, dt }: {
              packages.x86_64-linux.default = dt.packages.x86_64-linux.decision-theatre;
            };
          }
          EOF
          cd /tmp/consumer
          nix --extra-experimental-features 'nix-command flakes' \
            build .#default --no-link 2>&1 | tail -20
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

  # ==========================================
  # Container image from the flake
  #
  # The point of building the image from the flake is that its contents are the
  # runtime closure of the binary nix already builds, so the image cannot state a
  # dependency version that disagrees with the one that is tested. This job is
  # what makes that claim checkable: it builds the image, loads it and runs it.
  #
  # It is also the only place the image gets built at all — a nix build needs a
  # network-capable sandbox, which a developer has and a locked-down environment
  # may not.
  # ==========================================
  container-nix:
    runs-on: ubuntu-latest
    needs: [flake-lock-step]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build the image from the flake
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            build .#container --print-build-logs

      - name: Load it into docker
        run: |
          docker load < result
          docker image ls decision-theatre

      - name: It reports the flake's version
        run: |
          tag="$(nix --extra-experimental-features 'nix-command flakes' \
            eval --raw .#container.imageTag)"
          got="$(docker run --rm "decision-theatre:$tag" --version)"
          echo "$got"
          case "$got" in
            *"$tag"*) ;;
            *) echo "::error::--version ($got) does not match the image tag ($tag)"; exit 1 ;;
          esac

      - name: It serves
        run: |
          tag="$(nix --extra-experimental-features 'nix-command flakes' \
            eval --raw .#container.imageTag)"
          docker run -d --name dt-nix -p 8080:8080 "decision-theatre:$tag"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/api/health; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "::error::The container never became healthy"
            docker logs dt-nix
            exit 1
          fi
          curl -fsS -o /dev/null http://127.0.0.1:8080/          # the application
          curl -fsS -o /dev/null http://127.0.0.1:8080/docs/     # the mkdocs site
          docker rm -f dt-nix

      - name: It carries a trust store, so outbound TLS works
        run: |
          tag="$(nix --extra-experimental-features 'nix-command flakes' \
            eval --raw .#container.imageTag)"
          img="decision-theatre:$tag"

          # /api/geocode proxies upstream over TLS. Without SSL_CERT_FILE
          # resolving inside the image, every place-name search fails at
          # certificate verification, and nothing else in the image would say so.
          #
          # Read from outside rather than running anything: the image is the
          # application's closure plus cacert and tzdata, and has no shell. The
          # first version of this step ran `sh -c 'test -r "$SSL_CERT_FILE"'`
          # and reported "SSL_CERT_FILE is not readable" — when what actually
          # happened was that `sh` does not exist. A check whose failure message
          # asserts something it never tested is worse than no check.
          cert="$(docker image inspect "$img" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | sed -n 's/^SSL_CERT_FILE=//p')"
          if [ -z "$cert" ]; then
            echo "::error::the image declares no SSL_CERT_FILE"
            exit 1
          fi

          cid="$(docker create "$img")"
          if docker export "$cid" | tar -tf - "${cert#/}" > /dev/null 2>&1; then
            echo "trust store present: $cert"
            docker rm -f "$cid" > /dev/null
          else
            echo "::error::$cert is declared but is not in the image"
            docker rm -f "$cid" > /dev/null
            exit 1
          fi
