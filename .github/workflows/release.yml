name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Pushing the container image to GHCR. No PAT is needed — GITHUB_TOKEN can
  # write packages, provided the repository's Actions permissions are set to
  # "Read and write". A workflow can only narrow what the repository allows, so
  # if that setting is read-only this scope is silently not granted and the push
  # fails with a 403.
  packages: write

jobs:
  # ==========================================
  # Documentation — built once, from the flake
  #
  # Every platform build embeds this site, and each of them used to build it
  # itself with `pip install mkdocs …` off a hand-written package list. That
  # list omitted mkdocs-macros-plugin, which mkdocs.yml requires, so `mkdocs
  # build` aborted with "The macros plugin is not installed" on the first runner
  # to reach it — and fail-fast cancelled the other four. No release since has
  # carried a single platform artefact.
  #
  # flake.nix already declares the correct set in mkdocsEnv, and docs.yml
  # already builds the site this way. The release workflow was the only place
  # restating the dependencies by hand, which is the same failure the hand-
  # maintained Dockerfile had before it was replaced by the flake.
  # ==========================================
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build documentation
        run: nix build .#docs --print-build-logs

      - name: Collect the site
        run: |
          # `result` is a symlink into the read-only nix store; upload-artifact
          # needs a real, writable directory.
          mkdir -p docs_site
          cp -rL result/. docs_site/
          chmod -R u+w docs_site
          if [ ! -f docs_site/index.html ]; then
            echo "::error::the docs derivation produced no index.html"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs_site/

  # ==========================================
  # Build platform-specific binaries
  # ==========================================
  build:
    needs: docs
    strategy:
      # Every platform is required for the release, so cancelling the other four
      # the moment one fails only hides how much is broken — it took a run per
      # platform to learn that. Let them all report.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          # macos-13 was withdrawn, not merely deprecated: the label no longer
          # matches any runner, so a job requesting it is never scheduled. It
          # sits queued until GitHub cancels it at the 24-hour limit, which is
          # why a release appeared to "fail the next day". macos-14 is
          # deprecated and heading the same way, so both move to the current
          # GA pair — macos-15-intel for x86_64, macos-15 for Apple Silicon.
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # --- Build frontend (all platforms) ---
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # Built once by the `docs` job, from the flake, and embedded here. Not
      # rebuilt per platform: it is the same site five times over, and Python
      # is no longer needed on any of these runners.
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: internal/server/docs_site

      - name: Copy frontend to embed dir (unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf internal/server/static
          mkdir -p internal/server/static
          cp -r frontend/dist/* internal/server/static/

      - name: Copy frontend to embed dir (windows)
        if: runner.os == 'Windows'
        run: |
          Remove-Item -Recurse -Force internal\server\static -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force internal\server\static
          Copy-Item -Recurse frontend\dist\* internal\server\static\

      # --- Install platform CGO dependencies ---
      - name: Install CGO deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      # webview_go asks pkg-config for webkit2gtk-4.0, which Ubuntu 24.04
      # runners no longer ship (only 4.1). See scripts/webkit-compat.sh.
      - name: webkit2gtk-4.0 compatibility shim
        if: runner.os == 'Linux'
        run: ./scripts/webkit-compat.sh --github-env

      - name: Install CGO deps (macOS)
        if: runner.os == 'macOS'
        run: brew install openblas

      # --- Build binary ---
      - name: Build binary (unix)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/decision-theatre .

      - name: Build binary (windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: 1
        run: |
          mkdir dist
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/decision-theatre.exe .

      # --- Package ---
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf decision-theatre-${{ matrix.suffix }}.tar.gz decision-theatre
          # sha256sum is GNU coreutils. macOS does not ship it — it ships
          # shasum — so this step failed on both Darwin legs of the matrix
          # while passing on Linux, and took every downstream job with it.
          # The two print the same "<hash>  <file>" format, so the checksum
          # file is identical either way.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.tar.gz > checksums-${{ matrix.suffix }}.txt
          else
            shasum -a 256 *.tar.gz > checksums-${{ matrix.suffix }}.txt
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path decision-theatre.exe -DestinationPath decision-theatre-${{ matrix.suffix }}.zip
          $hash = (Get-FileHash decision-theatre-${{ matrix.suffix }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  decision-theatre-${{ matrix.suffix }}.zip" | Out-File -Encoding utf8 checksums-${{ matrix.suffix }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.suffix }}
          path: dist/checksums-*.txt

      # Upload raw binary for packaging jobs
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/decision-theatre

  # ==========================================
  # Linux: DEB and RPM via nfpm
  # ==========================================
  package-linux-nfpm:
    needs: build
    strategy:
      matrix:
        include:
          - suffix: linux-amd64
            goarch: amd64
          - suffix: linux-arm64
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist

      - name: Make binary executable
        run: chmod +x dist/decision-theatre

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build DEB
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}"
          nfpm package -p deb -f packaging/nfpm.yaml -t dist/

      - name: Build RPM
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}"
          nfpm package -p rpm -f packaging/nfpm.yaml -t dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages-nfpm-${{ matrix.suffix }}
          path: |
            dist/*.deb
            dist/*.rpm

  # ==========================================
  # Linux: AppImage
  # ==========================================
  package-appimage:
    needs: build
    strategy:
      matrix:
        include:
          - suffix: linux-amd64
            arch: x86_64
            os: ubuntu-latest
          - suffix: linux-arm64
            arch: aarch64
            # Built on an arm64 runner with the arm64 appimagetool. It used to
            # run the x86_64 tool here and pass ARCH=aarch64, which does not
            # give you a working aarch64 AppImage — the runtime it embeds is the
            # tool's own architecture.
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist

      - name: Make binary executable
        run: chmod +x dist/decision-theatre

      - name: Build AppImage
        env:
          # appimagetool is itself an AppImage, and a type-2 AppImage mounts
          # itself with libfuse2 — which the ubuntu-24.04 runner images no
          # longer carry. Without this it dies on `dlopen(): libfuse.so.2`, the
          # job fails, and the release ships with no AppImage at all. Asking it
          # to unpack itself instead needs no root and no extra package.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # Download appimagetool for the architecture we are building for
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage" -O appimagetool
          chmod +x appimagetool

          # Create AppDir
          mkdir -p AppDir/usr/bin
          cp dist/decision-theatre AppDir/usr/bin/
          cp packaging/appimage/AppRun AppDir/
          cp packaging/appimage/decision-theatre.desktop AppDir/
          # A real icon, rather than the zero-byte file that used to stand in
          # for one. Icon= in the .desktop entry points at this, so an empty
          # file means every desktop environment shows the AppImage with no
          # icon — and appimagetool is entitled to reject it outright. Reuses
          # the brand favicon rather than committing a second copy of it.
          cp docs/assets/brand/favicon.png AppDir/decision-theatre.png

          # Build
          ARCH=${{ matrix.arch }} ./appimagetool --no-appstream AppDir/ \
            "dist/Decision_Theatre-${{ matrix.arch }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-appimage-${{ matrix.suffix }}
          path: dist/*.AppImage

  # ==========================================
  # Linux: Flatpak
  # ==========================================
  package-flatpak:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-amd64
          path: dist

      - name: Make binary executable
        run: chmod +x dist/decision-theatre

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build Flatpak
        run: |
          cp dist/decision-theatre packaging/flatpak/
          cp packaging/decision-theatre.desktop packaging/flatpak/
          cd packaging/flatpak
          flatpak-builder --user --force-clean --repo=repo build org.kartoza.DecisionTheatre.yml
          flatpak build-bundle repo ../../dist/decision-theatre.flatpak org.kartoza.DecisionTheatre

      - uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak
          path: dist/*.flatpak

  # ==========================================
  # Linux: Snap
  # ==========================================
  package-snap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-amd64
          path: packaging/snap

      - name: Make binary executable
        run: chmod +x packaging/snap/decision-theatre

      # `version: git` is a core20-era keyword. Under core24 it is not
      # interpreted — it is taken literally, and the release shipped a snap
      # whose version was the three characters "git". Substituted here because
      # the tag is only known at release time; the checked-in value stays as the
      # placeholder it has always been.
      - name: Stamp the release version into the snap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i "s/^version: .*/version: '${VERSION#v}'/" packaging/snap/snapcraft.yaml
          grep '^version:' packaging/snap/snapcraft.yaml

      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: packaging/snap

      - uses: actions/upload-artifact@v4
        with:
          name: packages-snap
          path: ${{ steps.snapcraft.outputs.snap }}

  # ==========================================
  # macOS: .dmg Application Bundle
  # ==========================================
  package-macos:
    needs: build
    strategy:
      matrix:
        include:
          # Same runner labels as the build matrix above, for the same reason.
          - suffix: darwin-amd64
            arch: amd64
            os: macos-15-intel
          - suffix: darwin-arm64
            arch: arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist

      - name: Make binary executable
        run: chmod +x dist/decision-theatre

      - name: Create DMG
        run: |
          cd dist
          bash ../packaging/macos/create-dmg.sh \
            decision-theatre \
            "${{ github.ref_name }}" \
            "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos-${{ matrix.suffix }}
          path: dist/*.dmg

  # ==========================================
  # Windows: MSI installer
  # ==========================================
  package-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-windows-amd64
          path: dist

      - name: Extract binary
        run: |
          Expand-Archive -Path dist\decision-theatre-windows-amd64.zip -DestinationPath dist\

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSI
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          # Ensure 3-part version for MSI
          $parts = $version.Split(".")
          while ($parts.Length -lt 3) { $parts += "0" }
          $msiVersion = ($parts[0..2]) -join "."
          wix build packaging\windows\product.wxs -d Version=$msiVersion -o dist\decision-theatre-windows-amd64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: dist/*.msi

  # ==========================================
  # Publish GitHub release with all artifacts
  # ==========================================
  release:
    needs:
      - build
      - package-linux-nfpm
      - package-appimage
      - package-flatpak
      - package-snap
      - package-macos
      - package-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
          path: checksums

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release

      # Every artefact docs/developer-guide/releasing.md says a release carries.
      # A packaging job that produced nothing used to surface only as a release
      # quietly missing a platform — the checksum step swallowed the absence
      # with `2>/dev/null ... || true`, and nothing else looked. Now it stops
      # the release, and names what is missing.
      - name: Verify every documented artefact is present
        working-directory: release
        run: |
          # nullglob so `*.deb` with nothing to match expands to nothing rather
          # than to the literal string. It does not cover the exact filenames
          # below — a word with no wildcard in it is not a pattern at all, and
          # bash passes it through whether or not the file exists — so each
          # candidate is existence-tested rather than merely counted.
          shopt -s nullglob
          expected=(
            "1|decision-theatre-linux-amd64.tar.gz|Linux amd64 archive"
            "1|decision-theatre-linux-arm64.tar.gz|Linux arm64 archive"
            "1|decision-theatre-darwin-amd64.tar.gz|macOS amd64 archive"
            "1|decision-theatre-darwin-arm64.tar.gz|macOS arm64 archive"
            "1|decision-theatre-windows-amd64.zip|Windows amd64 archive"
            "2|*.deb|Debian packages (amd64 and arm64)"
            "2|*.rpm|RPM packages (amd64 and arm64)"
            "1|Decision_Theatre-x86_64.AppImage|AppImage, amd64"
            "1|Decision_Theatre-aarch64.AppImage|AppImage, arm64"
            "1|*.flatpak|Flatpak bundle"
            "1|*.snap|Snap package"
            "1|decision-theatre-darwin-amd64.dmg|macOS amd64 disk image"
            "1|decision-theatre-darwin-arm64.dmg|macOS arm64 disk image"
            "1|*.msi|Windows installer"
          )
          incomplete=0
          for row in "${expected[@]}"; do
            IFS='|' read -r want glob what <<< "$row"
            got=0
            for f in $glob; do
              [ -e "$f" ] && got=$((got + 1))
            done
            if [ "$got" -lt "$want" ]; then
              echo "::error::missing $what — expected $want file(s) matching '$glob', found $got"
              incomplete=1
            else
              printf '  ok   %s (%s)\n' "$what" "$got"
            fi
          done
          echo
          ls -lh
          if [ "$incomplete" != "0" ]; then
            echo "::error::the release is incomplete — not publishing a partial set"
            exit 1
          fi

      - name: Merge checksums
        run: |
          cat checksums/checksums-*.txt | sort > release/checksums.txt
          # No `|| true` here: the step above has already established that every
          # one of these exists, so a failure now is a real failure.
          cd release
          sha256sum *.deb *.rpm *.AppImage *.flatpak *.snap *.dmg *.msi >> checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # v2.4.0-rc1 and friends are marked as pre-releases, so the release
          # page agrees with what the container job did with :latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Installation

            ### Download the installer for your platform

            | Platform | Package | Notes |
            |----------|---------|-------|
            | **Ubuntu/Debian** | `.deb` | `sudo dpkg -i decision-theatre-*.deb` |
            | **Fedora/RHEL** | `.rpm` | `sudo rpm -i decision-theatre-*.rpm` |
            | **Any Linux** | `.AppImage` | `chmod +x *.AppImage && ./*.AppImage` |
            | **Flatpak** | `.flatpak` | `flatpak install decision-theatre.flatpak` |
            | **Snap** | `.snap` | `sudo snap install --dangerous *.snap` |
            | **NixOS** | Flake | `nix profile install github:kartoza/DecisionTheatre` |
            | **macOS** | `.dmg` | Open and drag to Applications |
            | **Windows** | `.msi` | Run the installer |
            | **Server (Docker)** | GHCR image | `ghcr.io/kartoza/decisiontheatre` — see **Container image** below |

            ### Portable binaries (no installer)

            **Linux/macOS:**
            ```bash
            tar xzf decision-theatre-*.tar.gz
            ./decision-theatre
            ```

            **Windows:**
            Extract the zip, then run `decision-theatre.exe`.

            ### Data Pack

            The application requires a data pack to load map tiles and scenario data.
            On first launch, you'll be prompted to provide the path to a data pack (.zip).
            Contact the project maintainers to obtain the data pack.

            ### Headless mode (no GUI window)
            ```bash
            ./decision-theatre --headless
            ```
            Then open http://localhost:8080 in your browser.

            ### Requirements
            - **Linux:** WebKitGTK 4.1 (`libwebkit2gtk-4.1-0` on Debian/Ubuntu)
            - **macOS:** No extra dependencies
            - **Windows:** Edge WebView2 runtime (included in Windows 10+)

  # ==========================================
  # Container image — published to GHCR and attached to the release
  #
  # The same image CI builds on every pull request, where it lives for 7 days as
  # an artefact. Here it becomes the long-lived one: pushed to GHCR under the
  # release version and :latest, with its SBOM and vulnerability scan attached
  # to the release itself.
  #
  # GHCR requires a lowercase path and this repository is kartoza/DecisionTheatre,
  # so the name is lowercased rather than interpolated directly.
  # ==========================================
  container:
    # Sequenced after `release` rather than run alongside it. This job appends
    # its section to the release body; the release job sets that body outright.
    # Run concurrently, whichever finishes last wins, and roughly half the time
    # the container notes are silently overwritten.
    needs: release
    # Ordering, not a gate. `needs` alone also means "only if that job
    # succeeded", which put the container image behind every platform package:
    # v2.4.0, v2.5.0 and v2.5.1 each published no image because a macOS leg
    # failed, leaving ghcr.io/kartoza/decisiontheatre:latest pointing at the
    # v2.3.0 build and looking to anyone pulling it like a reverted release.
    # The server image does not depend on a .dmg or an .msi existing, so this
    # keeps the sequencing and drops the gate. `append_body` means it composes
    # with the release body whether or not the release job wrote one.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the image from the flake
        id: build
        run: |
          nix build .#container --print-build-logs
          docker load < result
          tag="$(nix eval --raw .#container.imageTag)"
          name="$(nix eval --raw .#container.imageName)"
          echo "image=$name:$tag" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # Semver's own rule: anything after a hyphen is a pre-release
          # identifier — v2.4.0-rc1, v2.4.0-beta.2. Decided once here so the
          # push and the release notes cannot disagree about what this tag is.
          if [ "${GITHUB_REF_NAME}" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: It runs
        run: |
          docker run --rm ${{ steps.build.outputs.image }} --version

      - name: Export, describe and scan
        run: |
          docker save ${{ steps.build.outputs.image }} \
            | gzip > decision-theatre-image.tar.gz
          # syft, grype and python3 from the flake, pinned by flake.lock. A
          # release artefact's bill of materials is only as trustworthy as the
          # tool that produced it, so it is not fetched by piping a remote
          # install script into a shell.
          nix develop .#supplychain --command bash -euo pipefail -c '
            syft ${{ steps.build.outputs.image }} -o spdx-json > sbom.spdx.json
            syft ${{ steps.build.outputs.image }} -o json > sbom-syft.json
            grype sbom:sbom.spdx.json -o json > cve-scan.json 2>/dev/null \
              || echo "{\"matches\":[]}" > cve-scan.json
          '
          {
            printf '## Container image\n\n'
            printf '```bash\n'
            printf 'docker pull %s:%s   # this release, an immovable pin\n' \
              "$GHCR_REPO" "$GHCR_VERSION"
            if [ "$PRERELEASE" = "false" ]; then
              printf 'docker pull %s:latest  # the newest stable release\n' "$GHCR_REPO"
            fi
            printf '```\n\n'
            if [ "$PRERELEASE" = "false" ]; then
              printf 'Both tags are published: `:%s` never moves, and `:latest` now points here. Pin the version for anything you want to stay put.\n\n' "$GHCR_VERSION"
            else
              printf 'This is a **pre-release**, so only `:%s` was published. `:latest` is unchanged and still points at the most recent stable release, so an unpinned `docker pull` will not pick this up.\n\n' "$GHCR_VERSION"
            fi
            printf '### Software bill of materials\n\n'
            nix develop .#supplychain --command python3 scripts/sbom_table.py sbom-syft.json
            printf '\n### Vulnerability scan\n\n'
            nix develop .#supplychain --command python3 scripts/cve_table.py cve-scan.json
          } > build-report.md
        env:
          GHCR_REPO: ghcr.io/kartoza/decisiontheatre
          GHCR_VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          # Lowercased: GHCR rejects an uppercase path, and the repository name
          # carries capitals.
          ghcr="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          version="${{ steps.build.outputs.version }}"
          # :<version> is the immovable pin and is published for every tag.
          # :latest follows the newest *stable* release only — whatever it
          # points at is what an unpinned `docker pull` deploys, so a release
          # candidate must never land there.
          tags=("$version")
          if [ "${{ steps.build.outputs.prerelease }}" = "true" ]; then
            echo "::notice::${GITHUB_REF_NAME} is a pre-release — :latest left where it is"
          else
            tags+=("latest")
          fi
          for t in "${tags[@]}"; do
            docker tag ${{ steps.build.outputs.image }} "$ghcr:$t"
            docker push "$ghcr:$t"
          done

      - name: Attach the image, SBOM and scan to the release
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body_path: build-report.md
          files: |
            decision-theatre-image.tar.gz
            sbom.spdx.json
            cve-scan.json
