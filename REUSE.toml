version = 1

# Everything else under version control carries its own SPDX header
# directly (see scripts/ -- the one-off migration script that added them --
# for how). This file exists only for the two kinds of tracked file that
# genuinely cannot or should not: vendored third-party code, which keeps
# its own upstream license rather than being relicensed as AGPL-3.0, and
# machine-generated lockfiles, which carry no original authorship to license.

# internal/webview_go/libs/webview: github.com/webview/webview_go, vendored
# (see version.txt for the pinned commit). Its own LICENSE file is MIT.
[[annotations]]
path = "internal/webview_go/libs/webview/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 Serge Zaitsev, 2022 Steffen Andre Langnes"
SPDX-License-Identifier = "MIT"

# internal/webview_go/libs/mswebview2: Microsoft's WebView2 C headers,
# vendored for the Windows build (see version.txt). Its own LICENSE file is
# the standard Microsoft BSD-3-Clause grant.
[[annotations]]
path = "internal/webview_go/libs/mswebview2/**"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "BSD-3-Clause"

# internal/webview_go/examples: upstream webview_go's own example programs,
# vendored alongside the library itself (same origin, same MIT license).
[[annotations]]
path = "internal/webview_go/examples/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 Serge Zaitsev, 2022 Steffen Andre Langnes"
SPDX-License-Identifier = "MIT"

# Machine-generated dependency lockfiles: no original authorship to assert
# copyright over, same convention reuse-tool uses for its own poetry.lock.
[[annotations]]
path = ["go.sum", "frontend/package-lock.json", "flake.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kartoza"
SPDX-License-Identifier = "CC0-1.0"

# Self-hosted typefaces, vendored from nixpkgs (see
# frontend/src/assets/fonts/README.md) -- binary .woff2 files can't carry an
# inline comment header. Each stays under its own upstream OFL-1.1 grant,
# not Kartoza's AGPL-3.0.
[[annotations]]
path = ["frontend/src/assets/fonts/InterVariable.woff2", "frontend/src/assets/fonts/InterVariable-Italic.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["frontend/src/assets/fonts/SourceSans3VF-Upright.woff2", "frontend/src/assets/fonts/SourceSans3VF-Italic.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2010-2023 Adobe Systems Incorporated"
SPDX-License-Identifier = "OFL-1.1"

# Two page-background photos, vendored from Unsplash (see
# frontend/src/assets/backgrounds/README.md) -- free to use commercially
# with no attribution required, but not Kartoza's own work either.
[[annotations]]
path = ["frontend/src/assets/backgrounds/savanna-sunset.webp", "frontend/src/assets/backgrounds/mountain-lake.webp"]
precedence = "override"
SPDX-FileCopyrightText = "Unsplash contributors"
SPDX-License-Identifier = "LicenseRef-Unsplash"

# Everything below is Kartoza's own project infrastructure, documentation,
# and in-app screenshots/brand assets -- binary or comment-unfriendly
# formats (JSON, images, XML manifests, dotfiles) that carry the project's
# own AGPL-3.0 the same way every inline-headered source file does, just
# declared here instead of inside the file itself.
#
# Deliberately NOT covered by any annotation below, and left for
# `reuse lint` to keep surfacing until someone with the actual provenance
# can resolve them:
#   - frontend/src/assets/partners/** and docs/assets/partners/** (partner
#     and funder organisations' own logos -- not Kartoza's to license)
#   - the handful of other funder/partner marks alongside them in
#     frontend/src/assets/ (JM_FEFA_Logo_*, ap_es_logo.png, gci_logo.png,
#     rco_logo.png, wits_logo.png)
#   - undocumented photographs in frontend/src/assets/ with no equivalent
#     to the backgrounds/README.md paper trail (CattleLubangoAngola2_1.webp,
#     MorogoroTanzania_1.webp, Serengeti_Landscape_1.png,
#     Wildebeest_Serengeti_1.png, rural_communities.webp, land_owner.webp,
#     local_government.webp, future_possibilities.webp, our_mission.png)
#   - geodata and its derivatives (data/**, datasources/**), which may
#     carry their own upstream attribution terms (e.g. HydroBASINS)
[[annotations]]
path = [
  ".air.toml", ".dockerignore", ".dt-env.example", ".envrc", ".exrc",
  ".gitignore", ".gitleaksignore", ".golangci.yml", ".nvim.lua",
  ".pre-commit-config.yaml", ".trivyignore",
  "CHANGELOG.md", "CLAUDE.md", "Makefile", "PLAYWRIGHT_TASK.md",
  "README.dev.md", "README.md", "SPECIFICATION.md", "data-readme.md",
  "design-system.html", "design-tokens.json", "pr-body-unshakeable.md",
  "screenshot.png",
  "devbin/dt",
  ".github/workflows/*.yml",
  "benchmarks/*.md",
  "deployments/.gitignore", "deployments/Dockerfile*", "deployments/docker-compose.yaml", "deployments/nginx.conf",
  "docs/**/*.md", "docs/assets/brand/**", "docs/assets/images/screenshots/**", "docs/assets/css/kartoza-palette.json",
  "requirements/**/*.md", "requirements/mkdocs.yml", "mkdocs.yml",
  "frontend/eslint.config.js", "frontend/index.html", "frontend/package.json", "frontend/tsconfig.json",
  "frontend/src/assets/backgrounds/README.md",
  "frontend/src/assets/fonts/README.md",
  "frontend/src/data/places.json",
  "frontend/src/assets/AiOutlineFundView.png", "frontend/src/assets/Dials_screenshot.png",
  "frontend/src/assets/Getting_started.png", "frontend/src/assets/GoGraph.png",
  "frontend/src/assets/GoOrganization.png", "frontend/src/assets/Graph_screenshot.png",
  "frontend/src/assets/HiCode.png", "frontend/src/assets/Kartoza horizontal logo_white.png",
  "frontend/src/assets/Map_screenshot.webp", "frontend/src/assets/image_1.png",
  "frontend/src/assets/logo-vertical-white-3x 1.png", "frontend/src/assets/rewild_logo_white.png",
  "frontend/src/assets/sites_screenshot.webp", "frontend/src/assets/tour-view-modes.png",
  "go.mod", "package.json", "nix/manifest-lock.json",
  "packaging/appimage/AppRun", "packaging/appimage/decision-theatre.desktop",
  "packaging/decision-theatre.desktop", "packaging/flatpak/org.kartoza.DecisionTheatre.yml",
  "packaging/macos/Info.plist", "packaging/nfpm.yaml", "packaging/snap/snapcraft.yaml", "packaging/windows/product.wxs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kartoza"
SPDX-License-Identifier = "AGPL-3.0-only"
