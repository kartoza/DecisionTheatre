map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# The real client-facing scheme. $scheme alone is wrong whenever something in
# front of this nginx (a CDN, a load balancer) terminates TLS and forwards to
# us over plain HTTP: $scheme would then read "http" even though the browser
# is on HTTPS, and both the X-Forwarded-Proto we forward to the app and the
# sub_filter rewrite below would downgrade every tile/style URL, tripping the
# browser's mixed-content blocking. Trust an inbound X-Forwarded-Proto: https
# if one is already set; otherwise fall back to this listener's own scheme.
map $http_x_forwarded_proto $real_scheme {
    default $scheme;
    https   https;
}

# -----------------------------------------------------------------------------
# Rate limiting
#
# The application sheds load once it is saturated (internal/server/admission.go),
# which keeps latency bounded for the requests it accepts. What it cannot do is
# make the refusals free: a 503 still costs a connection, a TLS handshake, a
# proxy hop and a log line, and shedding actually raises the request rate,
# because a client that is refused in 20 ms comes back sooner than one made to
# wait 20 seconds. Measured with scripts/dtbench.py at 64 concurrent clients:
# request rate went from 1.1/s before admission control to 60/s after. The
# server stayed up and answered correctly throughout — but that is a lot of
# work to do in order to say no, and it is done in nginx far more cheaply than
# in Go.
#
# So the two layers divide as: nginx bounds how fast one client may ask, the
# application bounds how much work is in flight from everyone at once. Neither
# substitutes for the other. Rate limiting alone does not stop a thousand
# distinct addresses arriving at a polite rate each; admission control alone
# does not stop one address making a hundred thousand cheap requests.
#
# $binary_remote_addr, not $remote_addr: 4 bytes per IPv4 client instead of up
# to 15, so a 10m zone tracks ~160,000 addresses rather than ~40,000. Behind a
# CDN this sees the CDN's address and the limits become global rather than
# per-client — set real_ip_header/set_real_ip_from for that deployment, or the
# whole site shares one bucket.
# -----------------------------------------------------------------------------

# The expensive surface. 10 r/s sustained with a burst of 20: a quad-view page
# load fires roughly a dozen API calls at once and must not be throttled, while
# anything sustaining more than 10 r/s against endpoints that take seconds each
# is not a person using the site.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Tiles and static assets. Cheap per request but numerous — panning a map fires
# dozens of tile requests in a second, so this is deliberately high. It exists
# to bound a scraper walking the tile pyramid, not to shape ordinary use.
limit_req_zone $binary_remote_addr zone=assets:10m rate=100r/s;

# Concurrent connections per client. A browser opens at most 6 per origin on
# HTTP/1.1 and multiplexes over one on HTTP/2. 24 leaves room for several tabs
# and still stops one address holding hundreds of sockets open.
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 429, not the default 503. The distinction is worth keeping: 429 means this
# client asked too often and should slow down, 503 means the server is at
# capacity regardless of who is asking. The application emits the 503s; these
# are the other thing, and a log that conflates them cannot tell an overload
# from an abuser.
limit_req_status 429;
limit_conn_status 429;

# Log a throttle at warn rather than error. It is expected behaviour, and
# burying real errors under it is how the real errors get missed.
limit_req_log_level warn;
limit_conn_log_level warn;

# -----------------------------------------------------------------------------
# Crawler control
#
# robots.txt (internal/server/robots.go) asks crawlers to stay off /api. This
# is for the ones that do not read it. The named agents are declared AI
# training and search crawlers that have been observed ignoring or
# aggressively interpreting robots.txt; matching is case-insensitive and on a
# substring, since these strings appear inside longer UA lines.
#
# This blocks them from the API only, not from the site. The pages and the
# documentation stay readable by anything: the objective is to stop a crawler
# running full-dataset queries, not to hide the project.
#
# A user-agent is self-declared and trivially changed, so this catches the
# honest-but-greedy and nothing else. It is the cheap layer. The rate limits
# above and the admission control in the application are what hold when the UA
# is a lie.
# -----------------------------------------------------------------------------
map $http_user_agent $ai_crawler {
    default                 0;
    "~*GPTBot"              1;
    "~*ChatGPT-User"        1;
    "~*OAI-SearchBot"       1;
    "~*ClaudeBot"           1;
    "~*Claude-Web"          1;
    "~*anthropic-ai"        1;
    "~*CCBot"               1;
    "~*PerplexityBot"       1;
    "~*Bytespider"          1;
    "~*Amazonbot"           1;
    "~*meta-externalagent"  1;
    "~*FacebookBot"         1;
    "~*Google-Extended"     1;
    "~*Applebot-Extended"   1;
    "~*Diffbot"             1;
    "~*ImagesiftBot"        1;
    "~*Omgilibot"           1;
    "~*DataForSeoBot"       1;
    "~*SemrushBot"          1;
    "~*AhrefsBot"           1;
    "~*MJ12bot"             1;
    "~*DotBot"              1;
    "~*PetalBot"            1;
    "~*SeekportBot"         1;
    "~*serpstatbot"         1;
    "~*ZoominfoBot"         1;
}

upstream decision_theatre {
    server app:8080;
    keepalive 16;
}

# Matches internal/server/bodylimit.go's LargeMaxBodyBytes, with a little room
# for multipart overhead. It was 2g, which let a single request make the Go
# process buffer two gigabytes; nothing this application accepts is close.
#
# Raise both together or neither: a larger value here only means the request
# travels further before the application refuses it.
client_max_body_size 40m;

# The choropleth JSON response (the app's largest payload - several MB of
# dissolved catchment polygons at min zoom) compresses ~3-4x with gzip,
# since coordinate arrays and property keys are highly repetitive. Every
# response here comes through proxy_pass, and gzip_proxied defaults to
# off for proxied responses, so it must be turned on explicitly or gzip
# silently compresses nothing.
#
# The application now compresses these responses itself in server mode, at a
# level chosen to slightly beat what gzip_comp_level 6 achieves here — measured
# on the same 5,760,913-byte payload, 1,794,866 bytes from the application
# against 1,810,329 from nginx. nginx passes a body through untouched once
# Content-Encoding is set, so these directives no longer do the work for /api.
# They stay as the backstop for anything the application declines to compress,
# and they cost nothing. See internal/server/compress.go.
gzip on;
gzip_proxied any;
gzip_types application/json;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_vary on;

server {
    listen 80;
    server_name _;

    # Rewrite http:// tile/style URLs generated by the Go backend.
    # Aux tile ports (8081-8083) are Docker-internal and unreachable from the
    # browser, so we rewrite them back to the main host as well. $real_scheme
    # (see the map above) reflects the true client-facing scheme even when
    # TLS terminates upstream of this nginx, so the same rewrite works for
    # both listeners and for a fronting proxy/CDN.
    location ~ ^/data/(style|tiles)\.json$ {
        proxy_pass http://decision_theatre;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"http://localhost:8081/' '"$real_scheme://$http_host/';
        sub_filter '"http://localhost:8082/' '"$real_scheme://$http_host/';
        sub_filter '"http://localhost:8083/' '"$real_scheme://$http_host/';
        sub_filter '"http://127.0.0.1/' '"$real_scheme://$http_host/';
        sub_filter '"http://localhost/' '"$real_scheme://$http_host/';
    }

    # robots.txt must never be throttled or blocked: a crawler that cannot read
    # the rules behaves as though there are none. Served by the application
    # (internal/server/robots.go) so it stays correct if this nginx is replaced.
    location = /robots.txt {
        proxy_pass http://decision_theatre;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # The expensive surface: every /api request is a query over the dataset, and
    # the largest returns 14.7 MB after 4.5 s of work.
    location /api/ {
        # Declared AI and SEO crawlers get nothing here. Not 403 with a body —
        # 444 closes the connection without a response, which costs us a socket
        # teardown and nothing else. robots.txt asks nicely; this is for the
        # ones that did not read it. See the map block above.
        if ($ai_crawler) {
            return 444;
        }

        # burst=20 nodelay: a burst of 20 is admitted immediately rather than
        # being spaced out at the sustained rate, so a page load firing a dozen
        # calls at once is served at once. Without nodelay the same burst would
        # be trickled over two seconds and the site would feel broken to every
        # first-time visitor. Past the burst, 429.
        limit_req zone=api burst=20 nodelay;
        limit_conn perip 24;

        proxy_pass http://decision_theatre;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        # Was 300s. Nothing here legitimately takes five minutes: the slowest
        # measured call is the cold /api/precalculate/full at 26 s, and that one
        # now computes once for everyone rather than once per caller
        # (internal/api/sharedresult.go). This is the gap between successive
        # reads, not a total, so a slow but progressing response is unaffected;
        # what it bounds is a worker connection held by an upstream that has
        # stopped talking.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 5s;

        # Do not retry a request the upstream refused on purpose. Without this,
        # nginx treats a 503 from an overloaded application as a reason to try
        # again — adding load to a server that just said it had none to spare,
        # which is how a busy minute becomes an outage.
        proxy_next_upstream off;
    }

    # Tiles and glyphs: cheap individually, numerous in a burst. A high ceiling
    # that bounds a scraper walking the pyramid without shaping a map pan.
    location ~ ^/(tiles|fonts)/ {
        limit_req zone=assets burst=200 nodelay;
        limit_conn perip 24;

        proxy_pass http://decision_theatre;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://decision_theatre;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # No rate limit: this serves the page itself, and throttling that makes
        # a load the server can absorb look like an outage to the user. The
        # connection cap still applies — it bounds sockets held open, which is
        # the failure mode a slowloris exercises and a rate limit does not see.
        limit_conn perip 24;

        # Was 300s. Datapack and executable downloads stream through here, but
        # this bounds the gap between successive reads rather than the total, so
        # a download that is progressing is never cut off. What it stops is a
        # connection held for five minutes by an upstream that has gone quiet.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
    }
}

