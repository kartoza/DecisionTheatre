map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream decision_theatre {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2g;

    # Rewrite http:// tile/style URLs generated by the Go backend.
    # Go checks r.TLS (nil behind nginx) so it always emits http://.
    # Aux tile ports (8081-8083) are Docker-internal and unreachable from the
    # browser, so we rewrite them back to the main HTTPS host as well.
    location ~ ^/data/(style|tiles)\.json$ {
        proxy_pass http://decision_theatre;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"http://localhost:8081/' '"https://$host/';
        sub_filter '"http://localhost:8082/' '"https://$host/';
        sub_filter '"http://localhost:8083/' '"https://$host/';
        sub_filter '"http://127.0.0.1/' '"https://$host/';
        sub_filter '"http://localhost/' '"https://$host/';
    }

    location / {
        proxy_pass http://decision_theatre;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

