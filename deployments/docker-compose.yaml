services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    # Overridable so the image built from the flake can be used instead of the
    # one compose builds from deployments/Dockerfile:
    #   ./scripts/build-container.sh
    #   DT_IMAGE=decision-theatre:0.4.0 docker compose -f deployments/docker-compose.yaml up
    # Compose only builds when the named image is absent, so setting this to an
    # image that is already loaded uses it as-is.
    image: ${DT_IMAGE:-decision-theatre:latest}
    restart: unless-stopped
    # Not a --flag: a flag value is visible to anyone who can run `docker top`
    # or `ps` against the container, which a key should not be. Read directly
    # from the environment by internal/config.MapTilerAPIKey. Empty is a valid
    # value — the satellite basemap and font-glyph proxy just fail upstream
    # and the app falls back to the built-in basemap / unlabelled glyphs.
    environment:
      - DT_MAPTILER_API_KEY=${DT_MAPTILER_API_KEY:-}
    command:
      - --headless
      # Required and deliberate — see the note on CMD in Dockerfile. The
      # application defaults to loopback because its API is unauthenticated;
      # inside a container nothing would reach it, and nginx in front of this
      # service is what controls access.
      - --bind
      - 0.0.0.0
      - --port
      - "8080"
      - --data-dir
      - /app/data
      - --resources-dir
      - /app/resources
    expose:
      - "8080"
      - "8081"
      - "8082"
      - "8083"
    volumes:
      - ${DT_DATA_DIR}:/app/data
      - ${DT_RESOURCES_DIR}:/app/resources:ro
      - ../scripts:/app/scripts:ro
      - decision-theatre-dist:/app/dist:ro
      - decision-theatre-settings:/root/.config/decision-theatre

  # Toolchain container for `make pack-data` and
  # ./scripts/build-cross-docker.sh. Not started by `docker compose up` — run
  # on demand:
  #
  #   docker compose --profile build run --rm builder make pack-data
  #   docker compose --profile build run --rm builder ./scripts/build-cross-docker.sh
  #
  # Its output goes to decision-theatre-dist, the same volume the app service
  # reads its downloads from, never to this container's own filesystem.
  builder:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.builder
    image: decision-theatre-builder:latest
    profiles:
      - build
    working_dir: /src
    volumes:
      - ..:/src
      - ${DT_DATA_DIR}:/src/data
      - decision-theatre-dist:/src/dist
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:-./certs/tls.crt}:/etc/nginx/certs/tls.crt:ro
      - ${TLS_KEY_FILE:-./certs/tls.key}:/etc/nginx/certs/tls.key:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run

volumes:
  decision-theatre-settings:
  decision-theatre-dist:
