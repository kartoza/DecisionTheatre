services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: decision-theatre:latest
    restart: unless-stopped
    command:
      - --headless
      - --port
      - "8080"
      - --data-dir
      - /app/data
      - --resources-dir
      - /app/resources
    expose:
      - "8080"
      - "8081"
      - "8082"
      - "8083"
    volumes:
      - ${DT_DATA_DIR}:/app/data
      - ${DT_RESOURCES_DIR}:/app/resources:ro

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:-./certs/tls.crt}:/etc/nginx/certs/tls.crt:ro
      - ${TLS_KEY_FILE:-./certs/tls.key}:/etc/nginx/certs/tls.key:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
