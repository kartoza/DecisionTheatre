services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    # Overridable so the image built from the flake can be used instead of the
    # one compose builds from deployments/Dockerfile:
    #   ./scripts/build-container.sh
    #   DT_IMAGE=decision-theatre:0.4.0 docker compose -f deployments/docker-compose.yaml up
    # Compose only builds when the named image is absent, so setting this to an
    # image that is already loaded uses it as-is.
    image: ${DT_IMAGE:-decision-theatre:latest}
    restart: unless-stopped
    # Not a --flag: a flag value is visible to anyone who can run `docker top`
    # or `ps` against the container, which a key should not be. Read directly
    # from the environment by internal/config.MapTilerAPIKey. Empty is a valid
    # value — the satellite basemap and font-glyph proxy just fail upstream
    # and the app falls back to the built-in basemap / unlabelled glyphs.
    environment:
      - DT_MAPTILER_API_KEY=${DT_MAPTILER_API_KEY:-}
      # A soft memory ceiling for the Go heap, set below the container's hard
      # limit below. Without it the runtime has no idea it is in a box: it
      # grows the heap according to how much it has allocated, notices nothing
      # as it approaches the cgroup limit, and the kernel OOM-kills the process
      # mid-request. With it, the collector runs progressively harder as the
      # heap approaches this number and the process trades CPU for staying
      # alive — which is the trade you want, because a slow server recovers and
      # a killed one drops every request in flight.
      #
      # It must stay comfortably under DT_MEMORY_LIMIT. GOMEMLIMIT governs the
      # Go heap only; the process also holds SQLite page cache, mmap'd
      # mbtiles, thread stacks and the allocator's unreturned spans, none of
      # which it counts. The gap is that headroom, not slack.
      - GOMEMLIMIT=${DT_GOMEMLIMIT:-6GiB}
    # Sized for the documented 4-core/16 GB deployment target, leaving the rest
    # for nginx, the page cache the GeoPackage reads depend on, and the OS.
    # A limit is not a reservation: normal operation sits far below this, and
    # what the limit buys is that a runaway allocation kills one container
    # rather than pushing the host into swap and taking everything down with
    # it.
    mem_limit: ${DT_MEMORY_LIMIT:-8g}
    # No swap beyond the memory limit. Swapping a server this size does not
    # save it, it just makes every request slow enough to time out while the
    # health check keeps answering — failure that looks like life.
    memswap_limit: ${DT_MEMORY_LIMIT:-8g}
    # Go 1.25 sizes GOMAXPROCS from the cgroup CPU limit rather than the host's
    # core count, so this also sets the application's internal concurrency: the
    # admission controller in internal/server/admission.go admits two requests
    # per core. 4 cores gives 8 concurrent, which is what the measurements in
    # benchmarks/ were taken at.
    cpus: ${DT_CPU_LIMIT:-4}
    # restart: unless-stopped only reacts to a process that exited. This is how
    # a process that is still running but no longer answering gets noticed.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      # Generous: a cold start loads and indexes the datapack, and a health
      # check that fails during startup would restart the container forever.
      # start_period covers that window without weakening the steady-state check.
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 3
    command:
      - --headless
      # Required and deliberate — see the note on CMD in Dockerfile. The
      # application defaults to loopback because its API is unauthenticated;
      # inside a container nothing would reach it, and nginx in front of this
      # service is what controls access.
      - --bind
      - 0.0.0.0
      - --port
      - "8080"
      - --data-dir
      - /app/data
      - --resources-dir
      - /app/resources
    expose:
      - "8080"
      - "8081"
      - "8082"
      - "8083"
    volumes:
      - ${DT_DATA_DIR}:/app/data
      - ${DT_RESOURCES_DIR}:/app/resources:ro
      - ../scripts:/app/scripts:ro
      - decision-theatre-dist:/app/dist:ro
      - decision-theatre-settings:/root/.config/decision-theatre

  # Toolchain container for `make pack-data` and
  # ./scripts/build-cross-docker.sh. Not started by `docker compose up` — run
  # on demand:
  #
  #   docker compose --profile build run --rm builder make pack-data
  #   docker compose --profile build run --rm builder ./scripts/build-cross-docker.sh
  #
  # Its output goes to decision-theatre-dist, the same volume the app service
  # reads its downloads from, never to this container's own filesystem.
  builder:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.builder
    image: decision-theatre-builder:latest
    profiles:
      - build
    working_dir: /src
    volumes:
      - ..:/src
      - ${DT_DATA_DIR}:/src/data
      - decision-theatre-dist:/src/dist
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    # Small and fixed: nginx here proxies and rate-limits, it does not cache or
    # serve large files from disk. Capping it means a request flood cannot make
    # the front door compete with the application for the host's memory.
    mem_limit: ${DT_NGINX_MEMORY_LIMIT:-512m}
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:-./certs/tls.crt}:/etc/nginx/certs/tls.crt:ro
      - ${TLS_KEY_FILE:-./certs/tls.key}:/etc/nginx/certs/tls.key:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run

volumes:
  decision-theatre-settings:
  decision-theatre-dist:
