name: decision-theatre
version: git
summary: Offline exploration of African catchment data with scenario comparison
description: |
  Decision Theatre is an offline-first desktop application for exploring
  African catchment data: comparing restoration scenarios side by side,
  drawing a study area, and reading the indicators that result.

base: core24
confinement: strict
grade: stable

apps:
  decision-theatre:
    command: bin/decision-theatre --headless
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland

parts:
  decision-theatre:
    plugin: dump
    source: .
    organize:
      decision-theatre: bin/decision-theatre
    stage:
      - bin/decision-theatre
