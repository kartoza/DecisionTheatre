# Pre-commit configuration.
#
# Install with `make hooks`. The tools come from `nix develop .#tooling`, so
# what runs here matches what CI runs.
#
# The local hooks below are the ones specific to this project; the rest are
# standard hygiene. Anything that needs the network or more than a second or
# two belongs in CI, not here.

default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # Project-specific checks
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # The important one. A flake hash that has fallen behind its manifest is
      # invisible on the machine that caused it — the vendored output is already
      # in the local store, so nothing revalidates the hash — and breaks the
      # build for anyone importing this flake. Offline, and fast enough to run
      # on every commit.
      - id: flake-lock-step
        name: flake.nix is in step with go.mod, go.sum and package-lock.json
        entry: scripts/sync-flake.sh --check
        language: system
        pass_filenames: false
        files: '^(flake\.nix|go\.mod|go\.sum|frontend/package-lock\.json|nix/manifest-lock\.json)$'
        always_run: true

      # flake.nix and the lock file record the same fact; committing one without
      # the other is how the record goes stale.
      - id: flake-lock-staged-together
        name: flake.nix and nix/manifest-lock.json move together
        entry: scripts/hooks/check-flake-staged.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: go-fmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
        exclude: '^internal/webview_go/'

      - id: go-vet
        name: go vet
        entry: go vet ./internal/... .
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test-datacheck
        name: data contract has not drifted from the code
        entry: go test ./internal/datacheck/ -run TestSpec
        language: system
        pass_filenames: false
        files: '^(internal/(geodata|api|server|tiles|sites|datacheck)/.*\.go)$'

      - id: shell-syntax
        name: shell scripts parse
        entry: bash -n
        language: system
        files: '^scripts/.*\.sh$|^scripts/(dt|hooks/.*)$'

  # ---------------------------------------------------------------------------
  # Shell
  # ---------------------------------------------------------------------------
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=warning, --external-sources]

  # ---------------------------------------------------------------------------
  # Nix
  # ---------------------------------------------------------------------------
  - repo: https://github.com/nix-community/nixpkgs-fmt
    rev: v1.3.0
    hooks:
      - id: nixpkgs-fmt

  # ---------------------------------------------------------------------------
  # Secrets. The repository ships a data directory and deployment configs, so
  # this is not theoretical.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # General hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-yaml
      - id: check-json
        exclude: '^frontend/(package-lock\.json|tsconfig.*\.json)$'
      - id: end-of-file-fixer
        exclude: '^(docs/assets/diagrams/generated/|.*\.svg$)'
      - id: trailing-whitespace
        exclude: '^(docs/assets/diagrams/generated/|.*\.svg$)'
      - id: mixed-line-ending
        args: [--fix=lf]
